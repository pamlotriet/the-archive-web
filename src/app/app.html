<div class="flex min-h-screen w-full flex-col bg-background text-foreground">
  @if (isAuthenticated()) {
    <app-side-navigation />
  }
  @if (!isAuthenticated()) {
    <app-app-bar />
  }
  <main
    [class]="
      isAuthenticated()
        ? 'ml-68 flex w-[calc(100%-17rem)] min-w-0 flex-1 max-md:ml-0 max-md:w-full max-md:pb-19'
        : 'flex w-full flex-1'
    "
  >
    <router-outlet></router-outlet>
  </main>
</div>
