<div class="flex min-h-screen w-full flex-col px-6 py-8 sm:px-10 lg:px-12">
  <app-page-header
    eyebrowKey="tags.title"
    titleKey="tags.subtitle"
    summaryKey="tags.inUse"
    [summaryParams]="{ amount: tagsInUseCount() }"
    titleClass="mt-3 max-w-3xl font-serif text-4xl font-bold leading-tight text-foreground sm:text-5xl"
    layoutClass="flex w-full flex-col gap-5 border-b border-border/70 pb-8 lg:flex-row lg:items-end lg:justify-between"
  >
    <app-button
      page-actions
      class="shrink-0 self-start lg:self-end"
      buttonText="tags.newTag"
      iconName="plus"
      iconPosition="left"
      [showIcon]="true"
      customClass="!min-h-12 !w-fit !rounded-xl !border-0 !bg-[linear-gradient(100deg,#dca945,#f2c65f)] !px-4 !py-3 !font-extrabold !text-slate-950 hover:brightness-105"
      (buttonClick)="openNewEntry()"
    ></app-button>
  </app-page-header>

  <div class="mt-8 grid w-full grid-cols-[repeat(auto-fit,minmax(17rem,1fr))] gap-4">
    @for (tag of visibleTags(); track tag.id) {
      <article
        class="relative grid min-h-25 grid-cols-[3.75rem_minmax(0,1fr)_2.25rem] items-center gap-4 rounded-2xl border border-border bg-card/75 p-4 shadow-sm transition hover:-translate-y-0.5 hover:border-gold/25 hover:bg-card"
      >
        <div
          class="grid size-14 place-items-center rounded-xl text-white shadow-lg shadow-slate-950/10"
          [style]="tagSwatchStyle(tag.color)"
        >
          <svg class="size-5" pIcon="tag" aria-hidden="true"></svg>
        </div>

        <div class="min-w-0">
          <h3 class="truncate font-serif text-xl font-bold text-foreground">{{ tag.name }}</h3>
          <p class="mt-1 text-sm font-semibold text-muted-foreground">{{ tag.count }} items</p>
          <div class="mt-3 h-1 w-full max-w-28 overflow-hidden rounded-full bg-muted">
            <div class="h-full rounded-full bg-gold" [style.width.%]="tagCountProgress(tag.count)"></div>
          </div>
        </div>

        <app-tag-actions-menu (tagDelete)="deleteTag(tag.id)"></app-tag-actions-menu>
      </article>
    }
  </div>

  @if (isNewEntryOpen()) {
    <app-new-tag-dialog
      (dialogClose)="closeNewEntry()"
      (tagSave)="saveNewTag($event)"
    ></app-new-tag-dialog>
  }
</div>
