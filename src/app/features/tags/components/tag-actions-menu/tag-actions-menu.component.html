<button
  type="button"
  class="grid size-9 place-items-center rounded-xl text-muted-foreground transition hover:bg-muted hover:text-foreground focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-ring"
  aria-label="Tag actions"
  aria-haspopup="menu"
  [attr.aria-expanded]="isOpen()"
  (click)="toggle()"
>
  <svg class="size-5" pIcon="ellipsis-h" aria-hidden="true"></svg>
</button>

@if (isOpen()) {
  <div
    class="absolute right-4 top-18 z-20 w-40 overflow-hidden rounded-xl border border-white/10 bg-slate-950/95 p-1 text-sm text-white shadow-xl backdrop-blur"
    role="menu"
  >
    <button
      type="button"
      class="flex min-h-10 w-full items-center gap-2 rounded-lg px-3 text-left transition hover:bg-white/10"
      role="menuitem"
      (click)="edit()"
    >
      <svg class="size-4" pIcon="pencil" aria-hidden="true"></svg>
      <span>Edit</span>
    </button>

    <button
      type="button"
      class="flex min-h-10 w-full items-center gap-2 rounded-lg px-3 text-left text-red-200 transition hover:bg-red-500/20 hover:text-red-100"
      role="menuitem"
      (click)="delete()"
    >
      <svg class="size-4" pIcon="trash" aria-hidden="true"></svg>
      <span>Delete</span>
    </button>
  </div>
}
