<div class="flex w-full flex-wrap items-end gap-4">
  <p-floatlabel class="block w-full" variant="on">
    <p-iconfield class="block w-full" [iconPosition]="iconPosition()">
      @if (showIcon() && iconName()) {
        <p-inputicon>
          <svg
            class="size-4.5 text-current"
            [pIcon]="iconName()"
            [size]="18"
            aria-hidden="true"
          ></svg>
        </p-inputicon>
      }

      <input
        pInputText
        id="on_label"
        [type]="displayedType()"
        [ngClass]="inputClasses()"
        [formControl]="control()"
        [placeholder]="placeholder() | translate"
        autocomplete="off"
      />

      @if (type() === 'password') {
        <button
          type="button"
          class="absolute right-3 top-1/2 z-10 inline-flex -translate-y-1/2 items-center justify-center text-muted-foreground transition hover:text-primary focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring"
          [attr.aria-label]="
            (passwordVisible() ? 'common.actions.hidePassword' : 'common.actions.showPassword')
              | translate
          "
          [attr.aria-pressed]="passwordVisible()"
          (click)="togglePasswordVisibility()"
        >
          <svg
            class="size-5"
            [pIcon]="passwordVisible() ? 'eye-slash' : 'eye'"
            [size]="20"
            aria-hidden="true"
          ></svg>
        </button>
      }
    </p-iconfield>

    <label for="on_label">{{ floatLabel() | translate }}</label>
  </p-floatlabel>

  @if (errorMessage()) {
    <small class="text-sm text-red-500">{{ errorMessage() | translate }}</small>
  }
</div>
