<button
  pButton
  class="inline-flex items-center justify-center gap-2"
  [ngClass]="customClass()"
  [rounded]="rounded()"
  [severity]="severity()"
  [outlined]="variant() === 'outlined'"
  [text]="variant() === 'text'"
  [class.p-button-link]="variant() === 'link'"
  [attr.aria-label]="iconOnly() ? (buttonText() | translate) : null"
  [attr.aria-pressed]="iconOnly() ? active() : null"
  (click)="buttonClick.emit()"
>
  @if ((showIcon() || iconOnly()) && iconPosition() === 'left' && iconName()) {
    <svg
      pButtonIcon
      class="p-button-icon size-4.5 shrink-0 text-current"
      [class]="iconOnly() ? 'mr-0' : 'mr-2'"
      [pIcon]="iconName()"
      [size]="18"
      aria-hidden="true"
    ></svg>
  }

  @if (!iconOnly()) {
    <span>{{ buttonText() | translate }}</span>
  }

  @if ((showIcon() || iconOnly()) && iconPosition() === 'right' && iconName()) {
    <svg
      pButtonIcon
      class="p-button-icon size-4.5 shrink-0 text-current"
      [pIcon]="iconName()"
      [size]="18"
      aria-hidden="true"
    ></svg>
  }
</button>
