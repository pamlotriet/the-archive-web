<header [class]="layoutClass()">
  <div>
    <p class="text-sm font-bold uppercase tracking-[0.25em] text-muted-foreground">
      {{ eyebrowKey() | translate }}
    </p>
    <h1 [class]="titleClass()">
      {{ titleKey() | translate }}
    </h1>
    @if (summaryKey()) {
      <p class="mt-3 font-bold text-muted-foreground">
        {{ summaryKey()! | translate: summaryParams() }}
      </p>
    }
  </div>

  <ng-content select="[page-actions]"></ng-content>
</header>
